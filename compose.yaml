services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobagent
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: jobagent
    ports:
      # 5433 avoids collisions with a locally installed PostgreSQL on its default port.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobagent -d jobagent"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - jobagent-postgres:/var/lib/postgresql/data

volumes:
  jobagent-postgres:
